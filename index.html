.badge{background:#eaf2f9;color:#0f4c81;border-radius:999px;padding:6px 9px;font-size:12px;font-weight:800;white-space:nowrap}
.back{border:0;background:#eaf2f9;color:#0f4c81;padding:9px 12px;border-radius:10px;font-weight:800;margin-bottom:10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.kv{background:#f7f9fc;border-radius:12px;padding:11px}.k{font-size:12px;color:#778195}.v{font-weight:700;margin-top:4px;word-break:break-word}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}.action{border:1px solid #d9e2ec;background:#fff;padding:13px;border-radius:12px;font-weight:800}
.error{color:#b42318;margin-top:10px;font-weight:700}.empty{text-align:center;color:#778195;padding:24px 5px}
@media(max-width:430px){.grid{grid-template-columns:1fr}.hero{margin-top:10vh}}
</style>

<script>
(function(){
  var employees=[];
  try{ employees=JSON.parse(document.getElementById("employeeData").textContent); }catch(e){}
  var app=document.getElementById("app");
  var selected=null;
  function esc(x){return String(x==null?"":x).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
  function login(){
    app.innerHTML='<div class="container"><div class="card hero"><div class="logo">HR</div><h1>HR Numbers</h1><div class="muted">النسخة التجريبية للموارد البشرية</div><div class="field"><label>رمز الدخول</label><input id="pin" type="password" inputmode="numeric" placeholder="أدخل الرمز"></div><button class="btn primary" id="go">دخول</button><div id="err" class="error"></div><div class="small" style="margin-top:12px">رمز النسخة التجريبية: 1234</div></div></div>';
    document.getElementById("go").onclick=function(){
      if(document.getElementById("pin").value==="1234"){sessionStorage.setItem("hr_auth","1");home()}
      else document.getElementById("err").textContent="رمز الدخول غير صحيح";
    };
  }
  function home(){
    app.innerHTML='<div class="top">HR Numbers</div><div class="container"><div class="card"><div class="field"><label>البحث عن موظف</label><input id="q" placeholder="رقم الموظف أو الاسم"></div><div class="small">'+employees.length+' موظف</div><div id="list"></div></div></div>';
    var q=document.getElementById("q"), list=document.getElementById("list");
    function draw(){
      var s=q.value.trim().toLowerCase();
      var arr=employees.filter(function(e){return !s || String(e.id).indexOf(s)>=0 || String(e.fullName||"").toLowerCase().indexOf(s)>=0}).slice(0,50);
      list.innerHTML=arr.length?arr.map(function(e){return '<div class="result" data-id="'+esc(e.id)+'"><div><div class="name">'+esc(e.fullName||"بدون اسم")+'</div><div class="small">'+esc(e.jobTitle||e.department||e.company||"")+'</div></div><span class="badge">#'+esc(e.id)+'</span></div>'}).join(""):'<div class="empty">لا توجد نتائج</div>';
      Array.prototype.forEach.call(list.querySelectorAll(".result"),function(el){el.onclick=function(){selected=employees.find(function(x){return String(x.id)===el.getAttribute("data-id")});profile()}})
    }
    q.oninput=draw; draw();
  }
  function item(k,v){return '<div class="kv"><div class="k">'+k+'</div><div class="v">'+esc(v||"—")+'</div></div>'}
  function profile(){
    if(!selected){home();return}
    app.innerHTML='<div class="top">ملف الموظف</div><div class="container"><button class="back" id="back">رجوع</button><div class="card"><h2 style="margin-top:0">'+esc(selected.fullName)+'</h2><span class="badge">#'+esc(selected.id)+'</span><div class="grid" style="margin-top:14px">'+
      item("الوظيفة",selected.jobTitle)+item("القسم",selected.department)+item("مكان العمل",selected.workPlace)+item("منطقة العمل",selected.workArea)+item("مكان السكن",selected.livingPlace)+item("الجنسية",selected.nationality)+item("الشركة",selected.company)+item("انتهاء الإقامة",selected.residenceExpiration)+item("الحالة",selected.status)+'</div></div>'+
      '<div class="card"><strong>تسجيل معاملة</strong><div class="actions" style="margin-top:12px"><button class="action">غياب</button><button class="action">إذن خروج</button><button class="action">إجازة</button><button class="action">استقالة</button></div><div class="small" style="margin-top:12px">سيتم تفعيل حفظ المعاملات بعد اختبار هذه النسخة على الآيفون.</div></div></div>';
    document.getElementById("back").onclick=home;
  }
  if(sessionStorage.getItem("hr_auth")==="1") home(); else login();
})();
</script>
