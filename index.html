<style>
*{box-sizing:border-box}
:root{--blue:#0f4c81;--blue2:#eaf2f9;--bg:#f3f6fa;--text:#172033;--muted:#6d7788;--line:#e5eaf0;--danger:#b42318;--ok:#067647;--warn:#b54708}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
button,input,textarea,select{font-family:inherit}
.app{min-height:100vh}
.top{position:sticky;top:0;z-index:20;background:var(--blue);color:#fff;padding:calc(16px + env(safe-area-inset-top)) 16px 16px;font-weight:900;text-align:center;font-size:21px}
.container{max-width:820px;margin:auto;padding:18px 16px calc(36px + env(safe-area-inset-bottom))}
.card{background:#fff;border-radius:20px;padding:18px;margin:14px 0;box-shadow:0 6px 24px #0000000d}
.hero{text-align:center;margin-top:7vh}
.logo{width:78px;height:78px;margin:auto;background:var(--blue);color:#fff;border-radius:24px;display:grid;place-items:center;font-size:27px;font-weight:900}
h1,h2,h3{margin:0}.muted,.small{color:var(--muted)}.small{font-size:13px}.center{text-align:center}
.field{margin:14px 0}.field label{display:block;font-size:13px;font-weight:800;margin-bottom:7px}
input,textarea,select{width:100%;font-size:16px;border:1px solid #d5dce6;border-radius:13px;padding:13px;background:#fff;color:var(--text)}
textarea{min-height:92px;resize:vertical}
.btn{width:100%;border:0;border-radius:13px;padding:14px;font-size:15px;font-weight:900;cursor:pointer}
.primary{background:var(--blue);color:#fff}.secondary{background:var(--blue2);color:var(--blue)}.danger{background:#fff0ef;color:var(--danger)}.warning{background:#fff7ed;color:var(--warn)}
.toolbar{display:flex;gap:10px;align-items:center}.toolbar>*{flex:1}
.navgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.navbtn{border:1px solid #d9e2ec;background:#fff;padding:15px 10px;border-radius:13px;font-weight:900;color:var(--text)}
.result{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 2px;border-bottom:1px solid var(--line);cursor:pointer}
.result:last-child{border:0}.name{font-weight:900}.badge{background:var(--blue2);color:var(--blue);border-radius:999px;padding:7px 10px;font-size:12px;font-weight:900;white-space:nowrap}
.badge.off{background:#f2f4f7;color:#667085}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.kv{background:#f7f9fc;border-radius:13px;padding:11px}.k{font-size:12px;color:#778195}.v{font-weight:800;margin-top:4px;word-break:break-word}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}.action{border:1px solid #d9e2ec;background:#fff;padding:15px 10px;border-radius:13px;font-weight:900;color:var(--text)}
.back{border:0;background:var(--blue2);color:var(--blue);padding:10px 13px;border-radius:11px;font-weight:900}
.tx{border:1px solid var(--line);border-radius:14px;padding:13px;margin-top:10px}.tx-head{display:flex;justify-content:space-between;gap:10px;align-items:center}.tx-type{font-weight:900}.tx-date{font-size:12px;color:var(--muted)}.tx-meta{margin-top:8px;font-size:13px;line-height:1.7;color:#465164}
.pills{display:flex;gap:8px;overflow:auto;padding-bottom:4px;margin-top:10px}.pill{border:0;background:#eef3f8;border-radius:999px;padding:8px 11px;font-size:12px;font-weight:800;white-space:nowrap}.pill.active{background:var(--blue);color:#fff}
.statrow{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{background:#f7f9fc;border-radius:13px;padding:12px;text-align:center}.stat b{display:block;font-size:20px;color:var(--blue)}.stat span{font-size:11px;color:var(--muted)}
.info{background:#f7f9fc;border-radius:13px;padding:12px;font-weight:800}.calc{background:#eef8f1;color:var(--ok);border-radius:13px;padding:12px;font-weight:900;margin-top:10px}
.error{color:var(--danger);margin-top:10px;font-weight:800}.success{color:var(--ok);margin-top:10px;font-weight:800}.empty{text-align:center;color:#778195;padding:24px 5px}
.sep{height:1px;background:var(--line);margin:16px 0}.checkrow{display:flex;gap:9px;align-items:center}.checkrow input{width:auto}
.note{font-size:12px;line-height:1.7;color:var(--muted);background:#f7f9fc;border-radius:12px;padding:11px}
.hidden{display:none!important}
@media(max-width:430px){.grid{grid-template-columns:1fr}.statrow{grid-template-columns:1fr 1fr 1fr}}
</style>

function csvCell(v){v=String(v==null?"":v);return '"'+v.replace(/"/g,'""')+'"'}
function txToCSV(){
  var rows=[["Employee ID","Employee Name","Type","Date","From Date","To Date","Days","Exit Time","Return Time","Hours","Duration","Submit Date","Last Work Day","Reason","Notes"]];
  getTx().forEach(function(t){rows.push([t.employeeId,t.employeeName,t.type,t.date,t.fromDate,t.toDate,t.days,t.exitTime,t.returnTime,t.hours,t.duration,t.submitDate,t.lastWorkDay,t.reason,t.notes])});
  return "\ufeff"+rows.map(function(r){return r.map(csvCell).join(",")}).join("\r\n");
}

function login(){
 app.innerHTML='<div class="container"><div class="card hero"><div class="logo">HR</div><h1 style="margin-top:14px">HR Numbers</h1><div class="muted" style="margin-top:6px">النسخة النهائية المحلية</div><div class="field"><label>رمز الدخول</label><input id="pin" type="password" inputmode="numeric" placeholder="أدخل الرمز"></div><button class="btn primary" id="go">دخول</button><div id="err" class="error"></div><div class="small" style="margin-top:12px">رمز الدخول: 1234</div></div></div>';
 document.getElementById("go").onclick=function(){if(document.getElementById("pin").value==="1234"){sessionStorage.setItem("hr_auth","1");home()}else document.getElementById("err").textContent="رمز الدخول غير صحيح"};
}
function home(){
 var employees=allEmployees(),tx=getTx(),active=employees.filter(function(e){return String(e.status||"Active").toLowerCase()!=="inactive"}).length;
 app.innerHTML='<div class="top">HR Numbers</div><div class="container">'+
 '<div class="card"><div class="statrow"><div class="stat"><b>'+employees.length+'</b><span>إجمالي الموظفين</span></div><div class="stat"><b>'+active+'</b><span>نشط</span></div><div class="stat"><b>'+tx.length+'</b><span>معاملة</span></div></div></div>'+
 '<div class="card"><div class="navgrid"><button class="navbtn" id="addEmp">＋ إضافة موظف</button><button class="navbtn" id="tools">⚙️ الأدوات والنسخ الاحتياطي</button></div></div>'+
 '<div class="card"><div class="field"><label>البحث عن موظف</label><input id="q" placeholder="رقم الموظف أو الاسم"></div><div class="checkrow"><input id="showInactive" type="checkbox"><label for="showInactive" class="small">إظهار الموظفين غير النشطين</label></div><div id="list"></div></div>'+
 '<button class="btn danger" id="logout">تسجيل الخروج</button></div>';
 document.getElementById("logout").onclick=function(){sessionStorage.removeItem("hr_auth");login()};
 document.getElementById("addEmp").onclick=function(){employeeForm(null)};
 document.getElementById("tools").onclick=toolsPage;
 var q=document.getElementById("q"),show=document.getElementById("showInactive"),list=document.getElementById("list");
 function draw(){
  var s=q.value.trim().toLowerCase();
  var arr=allEmployees().filter(function(e){
    var inactive=String(e.status||"Active").toLowerCase()==="inactive";
    if(inactive&&!show.checked)return false;
    return !s||idstr(e.id).indexOf(s)>=0||String(e.fullName||"").toLowerCase().indexOf(s)>=0
  }).slice(0,80);
  list.innerHTML=arr.length?arr.map(function(e){
    var off=String(e.status||"Active").toLowerCase()==="inactive",c=employeeTx(e.id).length;
    return '<div class="result" data-id="'+esc(e.id)+'"><div><div class="name">'+esc(e.fullName||"بدون اسم")+'</div><div class="small">'+esc(e.jobTitle||e.company||e.department||"")+(c?' • '+c+' معاملة':'')+'</div></div><span class="badge'+(off?' off':'')+'">'+(off?'غير نشط ':'#')+esc(e.id)+'</span></div>'
  }).join(""):'<div class="empty">لا توجد نتائج</div>';
  Array.prototype.forEach.call(list.querySelectorAll(".result"),function(el){el.onclick=function(){selected=findEmployee(el.getAttribute("data-id"));profile()}})
 }
 q.oninput=draw;show.onchange=draw;draw();
}
function profile(){
 if(!selected){home();return}
 selected=findEmployee(selected.id); if(!selected){home();return}
 var inactive=String(selected.status||"Active").toLowerCase()==="inactive";
 app.innerHTML='<div class="top">ملف الموظف</div><div class="container"><button class="back" id="back">رجوع</button>'+
 '<div class="card"><div class="toolbar"><button class="btn secondary" id="edit">تعديل البيانات</button><button class="btn '+(inactive?'secondary':'warning')+'" id="toggle">'+(inactive?'إعادة تفعيل':'تعطيل الموظف')+'</button></div><div class="sep"></div><h2>'+esc(selected.fullName||"")+'</h2><div style="margin-top:8px"><span class="badge'+(inactive?' off':'')+'">#'+esc(selected.id)+(inactive?' • غير نشط':'')+'</span></div><div class="grid" style="margin-top:14px">'+
 item("الوظيفة",selected.jobTitle)+item("القسم",selected.department)+item("مكان العمل",selected.workPlace)+item("منطقة العمل",selected.workArea)+item("مكان السكن",selected.livingPlace)+item("الجنسية",selected.nationality)+item("الشركة",selected.company)+item("انتهاء الإقامة",selected.residenceExpiration)+item("الحالة",selected.status||"Active")+'</div></div>'+
 '<div class="card"><h3>تسجيل معاملة</h3><div class="actions" style="margin-top:12px"><button class="action" data-type="غياب">غياب</button><button class="action" data-type="إذن خروج">إذن خروج</button><button class="action" data-type="إجازة">إجازة</button><button class="action" data-type="استقالة">استقالة</button></div></div>'+
 '<div class="card"><h3>سجل المعاملات</h3><div class="pills">'+['الكل','غياب','إذن خروج','إجازة','استقالة'].map(function(x){return '<button class="pill'+(x===currentFilter?' active':'')+'" data-filter="'+x+'">'+x+'</button>'}).join("")+'</div><div id="txlist"></div></div>'+
 '<div class="card"><button class="btn danger" id="deleteEmp">حذف الموظف نهائيًا</button><div class="note" style="margin-top:10px">الحذف النهائي يخفي الموظف من التطبيق. معاملات الموظف لا تُحذف تلقائيًا حتى لا نفقد السجل.</div></div></div>';
 document.getElementById("back").onclick=home;
 document.getElementById("edit").onclick=function(){employeeForm(selected)};
 document.getElementById("toggle").onclick=function(){var e=Object.assign({},selected,{status:inactive?"Active":"Inactive"});saveEmployee(e,true);selected=e;profile()};
 document.getElementById("deleteEmp").onclick=function(){
   if(confirm("هل تريد حذف الموظف نهائيًا من قائمة الموظفين؟ سيبقى سجل معاملاته محفوظًا.")){deleteEmployee(selected.id);selected=null;home()}
 };
 Array.prototype.forEach.call(document.querySelectorAll(".action"),function(b){b.onclick=function(){txForm(b.getAttribute("data-type"))}});
 Array.prototype.forEach.call(document.querySelectorAll(".pill"),function(b){b.onclick=function(){currentFilter=b.getAttribute("data-filter");profile()}});
 drawTx();
}
function drawTx(){
 var box=document.getElementById("txlist"); if(!box)return;
 var tx=employeeTx(selected.id).filter(function(t){return currentFilter==="الكل"||t.type===currentFilter});
 box.innerHTML=tx.length?tx.map(function(t){
   var meta=[];
   if(t.fromDate&&t.toDate)meta.push("من "+esc(t.fromDate)+" إلى "+esc(t.toDate));
   if(t.days)meta.push("عدد الأيام: "+esc(t.days));
   if(t.exitTime&&t.returnTime)meta.push("الخروج: "+esc(t.exitTime)+" • العودة: "+esc(t.returnTime));
   if(t.hours)meta.push("المدة: "+esc(t.hours));
   if(t.date&&!t.fromDate)meta.push("التاريخ: "+esc(t.date));
   if(t.duration)meta.push("المدة: "+esc(t.duration));
   if(t.submitDate)meta.push("تاريخ تقديم الاستقالة: "+esc(t.submitDate));
   if(t.lastWorkDay)meta.push("آخر يوم عمل: "+esc(t.lastWorkDay));
   if(t.reason)meta.push("السبب: "+esc(t.reason));
   if(t.notes)meta.push("ملاحظات: "+esc(t.notes));
   return '<div class="tx"><div class="tx-head"><div class="tx-type">'+esc(t.type)+'</div><div class="tx-date">'+esc(t.date||t.fromDate||t.submitDate||"")+'</div></div><div class="tx-meta">'+(meta.length?meta.join("<br>"):"بدون تفاصيل إضافية")+'</div><button class="pill" style="margin-top:10px;color:#b42318" data-del="'+esc(t.id)+'">حذف</button></div>'
 }).join(""):'<div class="empty">لا توجد معاملات مسجلة</div>';
 Array.prototype.forEach.call(box.querySelectorAll("[data-del]"),function(b){b.onclick=function(){if(confirm("حذف هذه المعاملة؟")){setTx(getTx().filter(function(t){return t.id!==b.getAttribute("data-del")}));profile()}}})
}
function employeeForm(emp){
 var editing=!!emp;
 app.innerHTML='<div class="top">'+(editing?'تعديل موظف':'إضافة موظف')+'</div><div class="container"><button class="back" id="cancel">رجوع</button><div class="card">'+
 field("رقم الموظف","id",emp&&emp.id,"text",editing)+field("الاسم الكامل","fullName",emp&&emp.fullName)+field("الوظيفة","jobTitle",emp&&emp.jobTitle)+field("القسم","department",emp&&emp.department)+field("مكان العمل","workPlace",emp&&emp.workPlace)+field("منطقة العمل","workArea",emp&&emp.workArea)+field("مكان السكن","livingPlace",emp&&emp.livingPlace)+field("الجنسية","nationality",emp&&emp.nationality)+field("الشركة","company",emp&&emp.company)+field("انتهاء الإقامة","residenceExpiration",emp&&emp.residenceExpiration,"text")+
 '<div class="field"><label>الحالة</label><select id="status"><option value="Active">Active</option><option value="Inactive">Inactive</option></select></div>'+
 '<button class="btn primary" id="saveEmp">'+(editing?'حفظ التعديلات':'إضافة الموظف')+'</button><div id="msg"></div></div></div>';
 document.getElementById("cancel").onclick=function(){editing?profile():home()};
 document.getElementById("status").value=(emp&&emp.status)||"Active";
 document.getElementById("saveEmp").onclick=function(){
   var id=idstr(document.getElementById("id").value),name=document.getElementById("fullName").value.trim();
   if(!id||!name){document.getElementById("msg").innerHTML='<div class="error">رقم الموظف والاسم مطلوبان.</div>';return}
   if(!editing&&findEmployee(id)){document.getElementById("msg").innerHTML='<div class="error">رقم الموظف مستخدم بالفعل.</div>';return}
   var e={id:id,fullName:name,jobTitle:v("jobTitle"),department:v("department"),workPlace:v("workPlace"),workArea:v("workArea"),livingPlace:v("livingPlace"),nationality:v("nationality"),company:v("company"),residenceExpiration:v("residenceExpiration"),status:v("status")};
   saveEmployee(e,editing);selected=e;document.getElementById("msg").innerHTML='<div class="success">تم حفظ بيانات الموظف.</div>';setTimeout(profile,450)
 };
}
function field(label,id,val,type,disabled){
 return '<div class="field"><label>'+label+'</label><input id="'+id+'" type="'+(type||"text")+'" value="'+esc(val||"")+'" '+(disabled?'disabled':'')+'></div>'
}
function v(id){return document.getElementById(id).value.trim()}
function saveEmployee(e,editing){
 var s=empState(),id=idstr(e.id);
 if(isCustom(id)){
   s.added=(s.added||[]).map(function(x){return idstr(x.id)===id?e:x})
 }else{
   s.overrides=s.overrides||{};s.overrides[id]=e
 }
 // If adding brand new
 if(!editing&&!base.some(function(x){return idstr(x.id)===id})&&!isCustom(id)){s.added=s.added||[];s.added.push(e)}
 setEmpState(s)
}
function deleteEmployee(id){
 var s=empState(),sid=idstr(id);
 if(isCustom(sid))s.added=(s.added||[]).filter(function(e){return idstr(e.id)!==sid});
 else{if(!(s.deleted||[]).map(idstr).includes(sid)){s.deleted=s.deleted||[];s.deleted.push(sid)}}
 if(s.overrides)s.overrides[sid]&&delete s.overrides[sid];
 setEmpState(s)
}
function txForm(type){
 var body='';
 if(type==="إجازة"){
   body='<div class="field"><label>من تاريخ</label><input id="fromDate" type="date" value="'+today()+'"></div><div class="field"><label>إلى تاريخ</label><input id="toDate" type="date" value="'+today()+'"></div><div id="daysBox" class="calc">عدد أيام الإجازة: 1 يوم</div>';
 }else if(type==="إذن خروج"){
   body='<div class="field"><label>التاريخ</label><input id="date" type="date" value="'+today()+'"></div><div class="grid"><div class="field"><label>وقت الخروج</label><input id="exitTime" type="time"></div><div class="field"><label>وقت العودة</label><input id="returnTime" type="time"></div></div><div id="hoursBox" class="info">المدة: —</div>';
 }else if(type==="استقالة"){
   body='<div class="field"><label>تاريخ تقديم الاستقالة</label><input id="submitDate" type="date" value="'+today()+'"></div><div class="field"><label>آخر يوم عمل</label><input id="lastWorkDay" type="date"></div>';
 }else{
   body='<div class="field"><label>التاريخ</label><input id="date" type="date" value="'+today()+'"></div><div class="field"><label>المدة</label><input id="duration" placeholder="مثال: يوم واحد"></div>';
 }
 app.innerHTML='<div class="top">'+esc(type)+'</div><div class="container"><button class="back" id="cancel">رجوع</button><div class="card"><div class="small">الموظف</div><h2 style="margin-top:4px">'+esc(selected.fullName)+'</h2><div class="small" style="margin-top:5px">#'+esc(selected.id)+'</div>'+body+'<div class="field"><label>السبب</label><input id="reason" placeholder="اكتب السبب"></div><div class="field"><label>ملاحظات</label><textarea id="notes" placeholder="أي ملاحظات إضافية"></textarea></div><button class="btn primary" id="save">حفظ المعاملة</button><div id="msg"></div></div></div>';
 document.getElementById("cancel").onclick=profile;
 if(type==="إجازة"){var f=document.getElementById("fromDate"),t=document.getElementById("toDate"),box=document.getElementById("daysBox");function calc(){var n=daysInclusive(f.value,t.value);box.textContent=n?("عدد أيام الإجازة: "+n+" يوم"):"تاريخ النهاية يجب أن يكون بعد أو مساويًا لتاريخ البداية"}f.onchange=calc;t.onchange=calc;calc()}
 if(type==="إذن خروج"){var e1=document.getElementById("exitTime"),e2=document.getElementById("returnTime"),hb=document.getElementById("hoursBox");function ch(){hb.textContent="المدة: "+(hoursBetween(e1.value,e2.value)||"—")}e1.onchange=ch;e2.onchange=ch}
 document.getElementById("save").onclick=function(){
   var tx=getTx(),rec={id:"tx_"+Date.now()+"_"+Math.random().toString(36).slice(2,7),employeeId:selected.id,employeeName:selected.fullName,type:type,reason:v("reason"),notes:v("notes"),createdAt:new Date().toISOString()};
   if(type==="إجازة"){rec.fromDate=v("fromDate");rec.toDate=v("toDate");rec.days=daysInclusive(rec.fromDate,rec.toDate);if(!rec.fromDate||!rec.toDate||!rec.days){msg("تحقق من تاريخ بداية ونهاية الإجازة.",false);return}rec.date=rec.fromDate}
   else if(type==="إذن خروج"){rec.date=v("date");rec.exitTime=v("exitTime");rec.returnTime=v("returnTime");rec.hours=hoursBetween(rec.exitTime,rec.returnTime);if(!rec.date||!rec.exitTime||!rec.returnTime){msg("أدخل التاريخ ووقت الخروج والعودة.",false);return}}
   else if(type==="استقالة"){rec.submitDate=v("submitDate");rec.lastWorkDay=v("lastWorkDay");rec.date=rec.submitDate;if(!rec.submitDate||!rec.lastWorkDay){msg("أدخل تاريخ تقديم الاستقالة وآخر يوم عمل.",false);return}}
   else{rec.date=v("date");rec.duration=v("duration");if(!rec.date){msg("اختر التاريخ.",false);return}}
   tx.push(rec);setTx(tx);msg("تم حفظ المعاملة.",true);setTimeout(function(){currentFilter="الكل";profile()},450)
 }
}
function msg(t,ok){document.getElementById("msg").innerHTML='<div class="'+(ok?'success':'error')+'">'+esc(t)+'</div>'}

function toolsPage(){
 app.innerHTML='<div class="top">الأدوات والنسخ الاحتياطي</div><div class="container"><button class="back" id="back">رجوع</button>'+
 '<div class="card"><h3>تصدير المعاملات</h3><div class="small" style="margin-top:6px">ملف CSV يفتح في Excel ويحتوي على جميع المعاملات.</div><button class="btn primary" id="csv" style="margin-top:14px">تصدير المعاملات CSV</button></div>'+
 '<div class="card"><h3>نسخة احتياطية كاملة</h3><div class="small" style="margin-top:6px">تشمل المعاملات والموظفين المضافين والتعديلات والحذف.</div><button class="btn secondary" id="backup" style="margin-top:14px">تنزيل نسخة احتياطية JSON</button><button class="btn secondary" id="restore" style="margin-top:10px">استعادة نسخة احتياطية</button></div>'+
 '<div class="card"><h3>تنبيه مهم</h3><div class="note">البيانات محفوظة محليًا في Safari على هذا الجهاز. حذف بيانات Safari أو استخدام جهاز آخر لن ينقل البيانات تلقائيًا. استخدم النسخة الاحتياطية دوريًا.</div></div></div>';
 document.getElementById("back").onclick=home;
 document.getElementById("csv").onclick=function(){download("HR_Transactions_"+today()+".csv",txToCSV(),"text/csv;charset=utf-8")};
 document.getElementById("backup").onclick=function(){download("HRNumbers_Backup_"+today()+".json",JSON.stringify({version:"final-1",date:new Date().toISOString(),transactions:getTx(),employees:empState()},null,2),"application/json")};
 document.getElementById("restore").onclick=function(){document.getElementById("restoreFile").click()};
}
document.getElementById("restoreFile").addEventListener("change",function(ev){
 var file=ev.target.files&&ev.target.files[0];if(!file)return;
 var r=new FileReader();r.onload=function(){try{var d=JSON.parse(r.result);if(!Array.isArray(d.transactions)||!d.employees)throw new Error();if(confirm("سيتم استبدال البيانات المحلية الحالية بالنسخة الاحتياطية. متابعة؟")){setTx(d.transactions);setEmpState(d.employees);alert("تمت الاستعادة بنجاح.");home()}}catch(e){alert("ملف النسخة الاحتياطية غير صالح.")}};r.readAsText(file);ev.target.value=""
});
init();
if(sessionStorage.getItem("hr_auth")==="1")home();else login();
})();
</script>
</body>
</html>
